apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: skills
    contents:
      - path: .
        git:
          url: https://github.com/mattpocock/skills
          ref: v1.2.3
          depth: 1
        includePaths:
          - skills/engineering/**/*
          - skills/productivity/**/*
        newRootPath: skills
